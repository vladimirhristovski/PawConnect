<div class="auth-card card">
  <h2>Log in</h2>
  <form (ngSubmit)="submit()">
    <label
      >Username <input name="username" [(ngModel)]="username" required autocomplete="username"
    /></label>
    <label
      >Password
      <input
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        autocomplete="current-password"
    /></label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button type="submit" [disabled]="loading()">{{ loading() ? 'Logging in…' : 'Log in' }}</button>
  </form>
  <p>
    <a routerLink="/forgot-password">Forgot password?</a> · No account?
    <a routerLink="/register">Register</a>
  </p>
</div>
