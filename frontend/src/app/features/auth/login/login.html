<div class="auth-card card">
  <h2>Log in</h2>
  <form [formRoot]="loginForm">
    <label
      >Username
      <input type="text" [formField]="loginForm.username" autocomplete="username" />
      @if (loginForm.username().dirty() && loginForm.username().invalid()) {
        <div class="errors">
          @for (error of loginForm.username().errors(); track error.kind) {
            <p>{{ error.message }}</p>
          }
        </div>
      }
    </label>
    <label
      >Password
      <input type="password" [formField]="loginForm.password" autocomplete="current-password" />
      @if (loginForm.password().dirty() && loginForm.password().invalid()) {
        <div class="errors">
          @for (error of loginForm.password().errors(); track error.kind) {
            <p>{{ error.message }}</p>
          }
        </div>
      }
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button type="submit" [disabled]="!loginForm().valid() || loginForm().submitting()">
      @if (loginForm().submitting()) {
        Logging in…
      } @else {
        Log in
      }
    </button>
  </form>
  <p>
    <a routerLink="/forgot-password">Forgot password?</a> · No account?
    <a routerLink="/register">Register</a>
  </p>
</div>
