<div class="auth-card card">
  <h2>Forgot password</h2>
  @if (!sent()) {
    <form [formRoot]="forgotForm">
      <label
        >Email
        <input type="email" [formField]="forgotForm.email" />
        @if (forgotForm.email().dirty() && forgotForm.email().invalid()) {
          <div class="errors">
            @for (error of forgotForm.email().errors(); track error.kind) {
              <p>{{ error.message }}</p>
            }
          </div>
        }
      </label>
      <button type="submit" [disabled]="!forgotForm().valid() || forgotForm().submitting()">
        @if (forgotForm().submitting()) {
          Sending…
        } @else {
          Send reset link
        }
      </button>
    </form>
  } @else {
    <p class="success">If that email exists, a reset link has been sent.</p>
  }
  <p><a routerLink="/login">Back to login</a></p>
</div>
