<div class="auth-card card">
  <h2>Create an account</h2>
  <form [formRoot]="registerForm">
    <label
      >Username
      <input type="text" [formField]="registerForm.username" />
      @if (registerForm.username().dirty() && registerForm.username().invalid()) {
        <div class="errors">
          @for (error of registerForm.username().errors(); track error.kind) {
            <p>{{ error.message }}</p>
          }
        </div>
      }
    </label>
    <label
      >Email
      <input type="email" [formField]="registerForm.email" />
      @if (registerForm.email().dirty() && registerForm.email().invalid()) {
        <div class="errors">
          @for (error of registerForm.email().errors(); track error.kind) {
            <p>{{ error.message }}</p>
          }
        </div>
      }
    </label>
    <label
      >Password
      <input type="password" [formField]="registerForm.password" />
      @if (registerForm.password().dirty() && registerForm.password().invalid()) {
        <div class="errors">
          @for (error of registerForm.password().errors(); track error.kind) {
            <p>{{ error.message }}</p>
          }
        </div>
      }
    </label>
    <label
      >First name
      <input type="text" [formField]="registerForm.firstName" />
      @if (registerForm.firstName().dirty() && registerForm.firstName().invalid()) {
        <div class="errors">
          @for (error of registerForm.firstName().errors(); track error.kind) {
            <p>{{ error.message }}</p>
          }
        </div>
      }
    </label>
    <label
      >Last name
      <input type="text" [formField]="registerForm.lastName" />
      @if (registerForm.lastName().dirty() && registerForm.lastName().invalid()) {
        <div class="errors">
          @for (error of registerForm.lastName().errors(); track error.kind) {
            <p>{{ error.message }}</p>
          }
        </div>
      }
    </label>
    <label
      >Phone
      <input type="text" [formField]="registerForm.phone" />
      @if (registerForm.phone().dirty() && registerForm.phone().invalid()) {
        <div class="errors">
          @for (error of registerForm.phone().errors(); track error.kind) {
            <p>{{ error.message }}</p>
          }
        </div>
      }
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    @if (success()) {
      <p class="success">Account created — you can log in now.</p>
    }
    <button type="submit" [disabled]="!registerForm().valid() || registerForm().submitting()">
      @if (registerForm().submitting()) {
        Creating…
      } @else {
        Register
      }
    </button>
  </form>
  <p>Already have an account? <a routerLink="/login">Log in</a></p>
</div>
