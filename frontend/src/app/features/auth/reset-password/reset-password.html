<div class="auth-card card">
  <h2>Reset password</h2>
  <form [formRoot]="resetForm">
    <label
      >New password
      <input type="password" [formField]="resetForm.newPassword" />
      @if (resetForm.newPassword().dirty() && resetForm.newPassword().invalid()) {
        <div class="errors">
          @for (error of resetForm.newPassword().errors(); track error.kind) {
            <p>{{ error.message }}</p>
          }
        </div>
      }
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    @if (success()) {
      <p class="success">Password reset. You can log in now.</p>
    }
    <button
      type="submit"
      [disabled]="!resetForm().valid() || resetForm().submitting() || !token"
    >
      @if (resetForm().submitting()) {
        Resetting…
      } @else {
        Reset password
      }
    </button>
  </form>
  <p><a routerLink="/login">Back to login</a></p>
</div>
