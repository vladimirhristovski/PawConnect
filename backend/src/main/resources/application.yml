spring:
  application:
    name: pawconnect

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pawconnect}
    username: ${POSTGRES_USER:pawconnect}
    password: ${POSTGRES_PASSWORD:pawconnect}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/migration-dev
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_USERNAME}
    password: ${BREVO_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  cache:
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

logging:
  level:
    root: INFO
    com.sorsix.pawconnect: DEBUG
    org.springframework.web: INFO

management:
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production}
    access-token-ttl: 900000
    refresh-token-ttl: 2592000000
  reset-token-ttl: 3600000
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  mail:
    enabled: false
    from: ${MAIL_FROM_ADDRESS}

  geocoding:
    retry-interval: PT6H

  listings:
    expiry-check-interval: PT1H

  tokens:
    cleanup-interval: PT24H

azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    container-name: ${AZURE_STORAGE_CONTAINER_NAME:pet-photos}

pet-matcher:
  base-url: ${PET_MATCHER_URL:http://localhost:8000}
  timeout-ms: ${PET_MATCHER_TIMEOUT_MS:20000}